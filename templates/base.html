{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block meta %}
    <title>{{ name }}</title>
    {% endblock meta %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <a href="{% url 'main:show_main' %}" class="brand">
            {{ name }}
        </a>

        <nav>
            <a href="{% url 'main:show_main' %}">Profile</a>
            <a href="{% url 'main:show_experience' %}">Experience</a>
            <a href="{% url 'main:show_education' %}">Education</a>
        </nav>
    </header>

    {% block content %}
    {% endblock content %}

    <footer>
        <p>&copy; 2026 {{ name }}. All rights reserved.</p>
    </footer>

</body>
</html>
