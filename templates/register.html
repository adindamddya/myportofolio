{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Register</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                
                {% if field.errors %}
                    <ul>
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Register</button>
    </form>
</div>
{% endblock %}
